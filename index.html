<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Éditeur de Bandelettes A4</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="toolbar no-print">
        <div class="toolbar-group">
            <label>Mise en page :</label>
            <button id="btn-full" class="active" title="Pleine Page" aria-label="Pleine Page"><svg class="btn-icon" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true" viewBox="0 0 26 20" width="20" height="16"><rect x="1" y="1" width="24" height="18" rx="2"/></svg></button>
            <button id="btn-thirds" title="Tiers (Horizontal)" aria-label="Tiers (Horizontal)"><svg class="btn-icon" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true" viewBox="0 0 20 26" width="13" height="17"><rect x="1" y="1" width="18" height="24" rx="2"/><path d="M1 9h18M1 17h18"/></svg></button>
            <button id="btn-halves" title="Moitiés (Vertical)" aria-label="Moitiés (Vertical)"><svg class="btn-icon" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true" viewBox="0 0 26 20" width="20" height="16"><rect x="1" y="1" width="24" height="18" rx="2"/><path d="M1 10h24"/></svg></button>
            <button id="btn-eight" title="8 Rectangles" aria-label="8 Rectangles"><svg class="btn-icon" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true" viewBox="0 0 20 26" width="13" height="17"><rect x="1" y="1" width="18" height="24" rx="2"/><path d="M10 1v24M1 7h18M1 13h18M1 19h18"/></svg></button>
            <button id="btn-sixteen" title="16 Rectangles" aria-label="16 Rectangles"><svg class="btn-icon" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true" viewBox="0 0 26 20" width="20" height="16"><rect x="1" y="1" width="24" height="18" rx="2"/><path d="M7 1v18M13 1v18M19 1v18M1 5.5h24M1 10h24M1 14.5h24"/></svg></button>
        </div>

        <div class="toolbar-group">
            <label for="size-input">Taille :</label>
            <input type="number" id="size-input" min="6" max="500" placeholder="Auto" list="size-list">
            <datalist id="size-list">
                <option value="10"><option value="12"><option value="14"><option value="16">
                <option value="18"><option value="20"><option value="24"><option value="28">
                <option value="32"><option value="36"><option value="42"><option value="48">
                <option value="60"><option value="72"><option value="96"><option value="120">
                <option value="144"><option value="160"><option value="180"><option value="200">
            </datalist>
            <label class="check"><input type="checkbox" id="harmonize" checked> Même taille par page</label>
        </div>

        <div class="toolbar-group">
            <label for="font-selector">Police :</label>
            <select id="font-selector">
                <option value="'Caveat Brush', cursive" selected>Caveat Brush</option>
                <option value="'Sarabun', sans-serif">Sarabun</option>
                <option value="'Raleway', sans-serif">Raleway</option>
                <option value="Arial, sans-serif">Arial</option>
                <option value="'Times New Roman', serif">Times New Roman</option>
                <option value="'Courier New', monospace">Courier New</option>
                <option value="Georgia, serif">Georgia</option>
                <option value="Verdana, sans-serif">Verdana</option>
                <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
            </select>
        </div>

        <div class="toolbar-group">
            <label>Alignement :</label>
            <button id="btn-align-center" class="active" title="Centré" aria-label="Centré"><svg class="btn-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="10" x2="6" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="18" y1="18" x2="6" y2="18"/></svg></button>
            <button id="btn-align-left" title="Gauche" aria-label="Gauche"><svg class="btn-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="17" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="17" y1="18" x2="3" y2="18"/></svg></button>
        </div>

        <div class="toolbar-group">
            <button id="btn-uppercase" title="Majuscules" aria-label="Majuscules"><span class="btn-glyph">AA</span></button>
            <button id="btn-print" class="btn-primary"><svg class="btn-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>Imprimer</button>
            <button id="btn-pdf" title="Enregistrer en PDF" aria-label="Enregistrer en PDF"><svg class="btn-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
            <span id="print-warning" class="print-hint no-print">⚠ Impression : Marges « Aucune » + Échelle « Ajuster à la zone imprimable »</span>
            <button id="btn-import" title="Importer Liste" aria-label="Importer Liste"><svg class="btn-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
            <button id="btn-reset" title="Remise à zéro" aria-label="Remise à zéro"><svg class="btn-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button>
        </div>
    </header>

    <main id="page-container">
        <div id="a4-page" class="layout-full">
            <div class="editable-area" contenteditable="true">
                Cliquez ici pour éditer le texte...
            </div>
        </div>
    </main>

    <div id="import-modal" class="modal-overlay no-print" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="import-title">
            <h2 id="import-title">Importer une liste</h2>
            <p class="modal-hint">Un élément par ligne — chaque ligne remplit un rectangle.</p>
            <textarea id="import-text" rows="10" placeholder="Réunion de préparation&#10;5 min avant&#10;Après"></textarea>
            <p id="import-count" class="modal-count" aria-live="polite"></p>
            <div class="modal-actions">
                <button id="btn-cancel-import">Annuler</button>
                <button id="btn-do-import" class="btn-primary">Importer</button>
            </div>
        </div>
    </div>

    <script src="fit-utils.js"></script>
    <script src="script.js"></script>
</body>
</html>
